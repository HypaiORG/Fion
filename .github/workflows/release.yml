name: Build Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  KEEP_RUNS: 5

jobs:
  build-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FION_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        env:
          FION_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FION_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FION_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK with version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "Fion-$version.apk"
          echo "APK=Fion-$version.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Fion $GITHUB_REF_NAME" --generate-notes

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" --jq '.workflow_runs[].id' \
            | tail -n +$((KEEP_RUNS + 1)) \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}"
