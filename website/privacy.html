<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f2eb">
<!--head-meta-->
<link rel="icon" type="image/png" href="/images/icon_128.png">
<link rel="apple-touch-icon" href="/images/icon_128.png">
<link rel="preload" href="/fonts/jost-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="privacy.css">
</head>
<body>
<a class="skip-link" href="#main" data-t="skip">跳到正文</a>

<div class="bloom" aria-hidden="true"></div>

<nav class="nav" aria-label="Main">
  <div class="nav-inner">
    <div class="nav-left">
      <a class="nav-org" href="https://hypai.org/" aria-label="hypai"><img src="/images/wordmark.svg" alt="hypai" width="52" height="19"></a>
      <span class="nav-div" aria-hidden="true"></span>
      <a class="nav-product" href="{{home}}"><img src="/images/icon_128.png" alt="" width="22" height="22"><span data-t="name">飞鸿</span></a>
    </div>
    <div class="nav-right">
      <a href="{{privacy}}" aria-current="page" data-t="nav.policy">隐私政策</a>
      <div class="lang-toggle" role="group" aria-label="Language">
        <a href="/privacy" hreflang="en" data-set-lang="en"{{lang-en-attr}}>EN</a>
        <a href="/zh/privacy" hreflang="zh-CN" data-set-lang="zh"{{lang-zh-attr}}>中</a>
      </div>
    </div>
  </div>
</nav>

<main class="page" id="main">
  <header class="page-head">
    <div class="eyebrow" data-t="policy.sub">飞鸿 Fion · Android</div>
    <h1 data-t="policy.h1">隐私政策</h1>
  </header>

  <div class="doc-body">
    <!--content-->
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-copy">&copy; {{year}} Fion · designed by <a href="https://hypai.org/" style="border-bottom:1px solid var(--line)">hypai</a></span>
    <div class="footer-links">
      <a href="{{home}}" data-t="policy.home">飞鸿首页</a>
      <a href="https://github.com/HypaiORG/Fion">GitHub</a>
      <a href="mailto:support@hypai.org">support@hypai.org</a>
    </div>
  </div>
  <div class="watermark" aria-hidden="true"><img src="/images/wordmark.svg" alt="" width="192" height="70" loading="lazy" decoding="async"></div>
</footer>
</body>
</html>
